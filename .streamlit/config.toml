# Prism's default theme — matches modules/theme.py's DEFAULT_THEME ("slash":
# obsidian canvas + copper accent) so the native Streamlit chrome (widget
# borders, focus rings, etc.) agrees with the app's own injected CSS from
# first paint. The in-app theme selector overrides this at runtime via
# injected CSS; this file only controls the very first paint before any CSS
# is injected, and whatever the selector hasn't touched (e.g. some native
# widget chrome). Keep in sync with THEMES["slash"] in modules/theme.py if
# the default theme ever changes.
[theme]
base = "dark"
primaryColor = "#cc9166"
backgroundColor = "#08080a"
secondaryBackgroundColor = "#121317"
textColor = "#e2e3e9"
font = "sans serif"

[server]
# 50 MB is generous for the CSV/Excel files this app expects, while staying
# well under Streamlit Community Cloud's per-app memory ceiling.
maxUploadSize = 50

[browser]
gatherUsageStats = false
